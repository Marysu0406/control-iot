<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport estricto para evitar scroll y acomodar al 100% de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control IoT - Vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="girly-theme">
    <div class="remote-container">
        
        <!-- Barra de navegación superior -->
        <nav class="top-nav">
            <div class="brand-title"><i class="fa-solid fa-gamepad text-pink me-2"></i>IoT CONTROL</div>
            <div class="vehiculo-badge" id="vehiculo-info"><i class="fa-solid fa-car-side me-1"></i>Vehículo 1</div>
        </nav>

        <!-- Panel de indicadores de estado -->
        <div class="status-panel">
            <div class="d-flex justify-content-between text-center w-100">
                <div class="status-item">
                    <div class="status-label">WSS</div>
                    <div id="status-wss" class="status-indicator warning"><i class="fa-solid fa-spinner fa-spin"></i></div>
                </div>
                <div class="status-item border-start border-end border-pink px-2">
                    <div class="status-label">API</div>
                    <div id="status-api" class="status-indicator warning"><i class="fa-solid fa-spinner fa-spin"></i></div>
                </div>
                <div class="status-item">
                    <div class="status-label">RDS</div>
                    <div id="status-rds" class="status-indicator warning"><i class="fa-solid fa-spinner fa-spin"></i></div>
                </div>
            </div>
        </div>

        <!-- Barra de acción en vivo -->
        <div class="live-action-bar mb-2">
            <span id="live-action-text" class="fw-bold">✨ SISTEMA INICIADO ✨</span>
        </div>

        <!-- Botón prioritario de emergencia -->
        <div class="emergency-container mb-3">
            <button id="btn-detener" class="btn-stop-girly w-100 fw-bold fs-5 shadow"><i class="fa-solid fa-hand me-2"></i>DETENER SISTEMA</button>
        </div>

        <!-- Área de controles dinámicos (Grid Responsivo) -->
        <div class="responsive-controls">
            
            <!-- Botones centrales (Toggles) -->
            <div class="toggles-container">
                <button id="btn-foco" class="btn-toggle-girly" data-comando="9">
                    <i class="fa-solid fa-lightbulb"></i> <span>Foco</span>
                </button>
                <button id="btn-sonido" class="btn-toggle-girly" data-comando="10">
                    <i class="fa-solid fa-music"></i> <span>Sonido</span>
                </button>
                <button id="btn-velocidad" class="btn-toggle-girly" data-comando="11">
                    <i class="fa-solid fa-bolt"></i> <span>Veloz</span>
                </button>
            </div>

            <!-- Joystick Izquierdo (Tracción) -->
            <div class="joystick-wrapper j-izq">
                <div class="control-title">DESPLAZAMIENTO</div>
                <div id="joystick-traccion" class="joystick-base">
                    <div class="joystick-knob"></div>
                </div>
            </div>

            <!-- Joystick Derecho (Cabina/Pala) -->
            <div class="joystick-wrapper j-der">
                <div class="control-title">CABINA/BRAZO</div>
                <div id="joystick-herramienta" class="joystick-base">
                    <div class="joystick-knob"></div>
                </div>
            </div>
            
        </div>

        <!-- Sección para la selección y ejecución de secuencias DEMO -->
        <div class="demo-section mt-auto">
            <div class="control-title text-start mb-1" style="font-size: 0.7rem;">SECUENCIAS AUTOMÁTICAS</div>
            <div class="d-flex gap-2">
                <select id="select-demo" class="form-select select-girly shadow-sm">
                    <option value="">Cargando demos...</option>
                </select>
                <button id="btn-play-demo" class="btn-play-girly px-3"><i class="fa-solid fa-play"></i></button>
            </div>
        </div>

    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/joystick.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
